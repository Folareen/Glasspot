services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./db-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: